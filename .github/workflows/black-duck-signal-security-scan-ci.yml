name: CI Black Duck Signal security scan

on:
  push:
    branches: [ main, master, develop, stage, release ]
  workflow_dispatch:

jobs:
  signal:
    runs-on: ubuntu-latest
    
    #permissions:
      #contents: write
      #issues: write
      #pull-requests: write
      #security-events: write
      #actions: read
    env:
      BRIDGE_POLARIS_SERVERURL: ${{ vars.POLARIS_SERVER_URL }}
      BRIDGE_POLARIS_ACCESSTOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
      BRIDGE_SIGNAL_LLM_URI: ${{ vars.LLM_URL }}
      BRIDGE_SIGNAL_LLM_KEY: ${{ secrets.LLM_KEY }}
      BRIDGE_POLARIS_APPLICATION_NAME: HVP-Demo-1
      BRIDGE_POLARIS_PROJECT_NAME: ${{ github.event.repository.name }}
      BRIDGE_POLARIS_BRANCH_NAME: ${{ github.ref_name }}
      
    steps:
    
    - name: Checkout Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Signal Scan
      run: |
        curl -fLsS -o bridge.zip ${{ vars.BRIDGECLI_LINUX64 }} && unzip -qo -d ${{ runner.temp }} bridge.zip && rm -f bridge.zip
        ${{ runner.temp }}/bridge-cli-bundle-linux64/bridge-cli --verbose --stage signal signal.mode=PROJECT signal.platform=polaris signal.args="--llm-mode byo --llm-singlefilescan-agent-model claude-sonnet-4-6 --llm-dataflow-agent-model claude-sonnet-4-6 --llm-oversight-agent-model claude-sonnet-4-6 --llm-exploitation-agent-model claude-sonnet-4-6 --llm-sca-agent-model claude-sonnet-4-6 --llm-mergekey-embed-agent-model text-embedding-3-large --llm-oversight-embed-agent-model text-embedding-3-large"
    
#    - name: Upload SARIF file
